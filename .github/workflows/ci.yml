name: CI Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev

env:
  REGISTRY: docker.io
  BACKEND_IMAGE: muhammadmuhidin/core-be
  FRONTEND_IMAGE: muhammadmuhidin/core-fe

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set image tag
        id: vars
        run: |
          SHORT_SHA=$(echo ${GITHUB_SHA} | cut -c1-7)

          if [[ "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "ENV_TAG=prod" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=prod-$SHORT_SHA" >> $GITHUB_OUTPUT
          else
            echo "ENV_TAG=dev" >> $GITHUB_OUTPUT
            echo "IMAGE_TAG=dev-$SHORT_SHA" >> $GITHUB_OUTPUT
          fi

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build backend image
        run: |
          docker build \
            -t $BACKEND_IMAGE:${{ steps.vars.outputs.IMAGE_TAG }} \
            -t $BACKEND_IMAGE:${{ steps.vars.outputs.ENV_TAG }} \
            ./backend

      - name: Push backend image
        run: |
          docker push $BACKEND_IMAGE:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push $BACKEND_IMAGE:${{ steps.vars.outputs.ENV_TAG }}

      - name: Build frontend image
        run: |
          docker build \
            -t $FRONTEND_IMAGE:${{ steps.vars.outputs.IMAGE_TAG }} \
            -t $FRONTEND_IMAGE:${{ steps.vars.outputs.ENV_TAG }} \
            ./frontend

      - name: Push frontend image
        run: |
          docker push $FRONTEND_IMAGE:${{ steps.vars.outputs.IMAGE_TAG }}
          docker push $FRONTEND_IMAGE:${{ steps.vars.outputs.ENV_TAG }}