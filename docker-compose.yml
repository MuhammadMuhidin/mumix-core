version: "3.9"

services:
  nginx:
    image: nginx:stable-alpine
    container_name: reverse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/certs:/etc/nginx/certs
    depends_on:
      - frontend
      - backend
    networks:
      - app_network

  frontend:
    #image: local-core-fe:${ENV_TAG} # local image
    image: muhammadmuhidin/core-fe:${ENV_TAG} # dockerhub image
    pull_policy: always # dockerhub image
    container_name: frontend
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - ./frontend/.env
    networks:
      - app_network

  backend:
    #image: local-core-be:${ENV_TAG} # local image
    image: muhammadmuhidin/core-be:${ENV_TAG} # dockerhub image
    pull_policy: always # dockerhub image
    container_name: backend
    restart: unless-stopped
    expose:
      - "4000"
    env_file:
      - ./backend/.env
    networks:
      - app_network

networks:
  app_network:
    driver: bridge